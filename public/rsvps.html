<html lang="en">

<meta charset="utf-8">

<title>Guest RSVPs · Easy Wedding</title>
<style>
 :root{--maroon:#571c24;--gold:#c9a24b;--ivory:#fdf8ec;--ink:#33231f;--soft:#7a5c48}
 *{box-sizing:border-box}
 body{margin:0;font-family:Georgia,'Times New Roman',serif;background:var(--ivory);color:var(--ink)}
 header{background:var(--maroon);color:var(--ivory);padding:26px 20px;text-align:center;border-bottom:4px solid var(--gold)}
 header h1{margin:0;font-size:30px;font-style:italic;font-weight:600}
 header p{margin:6px 0 0;font-family:system-ui,sans-serif;font-size:13px;letter-spacing:.14em;text-transform:uppercase;color:#e8cf8f}
 main{max-width:880px;margin:0 auto;padding:26px 18px 60px}
 .card{background:#fffdf6;border:1px solid #e5d3a8;border-radius:14px;padding:20px 22px;margin:0 0 18px;box-shadow:0 6px 24px rgba(87,28,36,.07)}
 .card h2{margin:0 0 4px;font-size:21px;color:var(--maroon)}
 .meta{font-family:system-ui,sans-serif;font-size:13px;color:var(--soft);margin:0 0 14px}
 .chips{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 18px}
 .chip{font-family:system-ui,sans-serif;font-size:13px;background:#f3e5bd;border:1px solid var(--gold);color:var(--maroon);border-radius:999px;padding:5px 12px}
 table{width:100%;border-collapse:collapse;font-family:system-ui,sans-serif;font-size:14px}
 th{text-align:left;color:var(--maroon);border-bottom:2px solid var(--gold);padding:7px 8px}
 td{border-bottom:1px solid #eee0bd;padding:8px;vertical-align:top}
 .yes{color:#1e6b34;font-weight:600}.no{color:#9b2c2c;font-weight:600}
 .note{color:var(--soft);font-size:13px}
 .empty,.state{text-align:center;padding:34px 10px;color:var(--soft);font-size:17px}
 a.btn{display:inline-block;background:var(--maroon);color:var(--ivory);text-decoration:none;padding:10px 20px;border-radius:999px;font-family:system-ui,sans-serif;font-size:14px;margin-top:12px}
</style>
</head>
